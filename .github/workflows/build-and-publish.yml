name: Build, test, and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ContextKit.slnx

      - name: Build
        run: dotnet build ContextKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ContextKit.slnx --configuration Release --no-build

      - name: Run Docker MCP smoke tests
        run: bash scripts/test-mcp-docker.sh

  calculate-version:
    name: Calculate release version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install nbgv CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate version
        id: version
        shell: bash
        run: |
          NBGV="$RUNNER_TEMP/nbgv/nbgv" ./scripts/calculate-version.sh

  publish:
    name: Publish package and release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(needs['calculate-version'].outputs.version, '-preview.') && !contains(needs['calculate-version'].outputs.version, '-preview.0'))
    needs:
      - build-test
      - calculate-version
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/ContextKit.Cli/ContextKit.Cli.csproj

      - name: Pack
        run: >-
          dotnet pack src/ContextKit.Cli/ContextKit.Cli.csproj --configuration Release --no-restore --output artifacts
          -p:PublicRelease=true -p:PackageVersion=${{ needs['calculate-version'].outputs.version }}
          -p:GroundKitProviderVersion=${{ needs['calculate-version'].outputs.version }}
          -p:GroundKitProviderReleaseTag=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}

      - name: Pack MCP host
        run: >-
          dotnet pack src/ContextKit.Mcp/ContextKit.Mcp.csproj --configuration Release --output artifacts
          -p:PublicRelease=true -p:PackageVersion=${{ needs['calculate-version'].outputs.version }}
          -p:GroundKitProviderVersion=${{ needs['calculate-version'].outputs.version }}
          -p:GroundKitProviderReleaseTag=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}

      - name: Publish to NuGet.org
        continue-on-error: true
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish self-contained executables
        shell: bash
        run: |
          set -euo pipefail
          for runtime in linux-x64 osx-x64 osx-arm64 win-x64; do
            publish_dir="release/$runtime"
            mkdir -p "$publish_dir"
            dotnet publish src/ContextKit.Cli/ContextKit.Cli.csproj \
              --configuration Release \
              --runtime "$runtime" \
              --self-contained true \
              --output "$publish_dir" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false \
              -p:GroundKitProviderVersion="${{ needs['calculate-version'].outputs.version }}" \
              -p:GroundKitProviderReleaseTag="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}"
            if [[ "$runtime" == win-* ]]; then
              (cd "$publish_dir" && zip -q "../../artifacts/groundkit-$runtime.zip" ContextKit.Cli.exe)
            else
              tar -czf "artifacts/groundkit-$runtime.tar.gz" -C "$publish_dir" ContextKit.Cli
            fi
            bash scripts/package-semantic-provider.sh \
              --runtime "$runtime" \
              --output artifacts \
              --version "${{ needs['calculate-version'].outputs.version }}"
          done

      - name: Publish matching Release Drafter draft
        if: always()
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs['calculate-version'].outputs.version }}
          name: v${{ needs['calculate-version'].outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs['calculate-version'].outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs['calculate-version'].outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}" artifacts/groundkit-* --clobber
