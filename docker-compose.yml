services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      GROUNDKIT_HOME: /data
    ports:
      - "8081:8080"
    volumes:
      - mcp-data:/data

  mcp-stdio:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    entrypoint: ["dotnet", "ContextKit.Mcp.dll"]
    environment:
      GROUNDKIT_HOME: /data
    stdin_open: true
    volumes:
      - mcp-data:/data

volumes:
  mcp-data:
